name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        env:
          NODE_OPTIONS: --no-warnings
          DATA_DIR: /tmp/sporlag-data
          SESSION_SECRET: ci-only-session-secret-not-for-production
        run: npm run check
